[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdwisdom-hermes-video-ads"
version = "0.1.0"
description = "Hermes multi-agent pipeline for CrowdWisdomTrading cinematic video ads"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0", "requests>=2.31", "pydantic>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
